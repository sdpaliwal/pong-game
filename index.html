<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pong Game</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎮 PONG GAME 🎮</h1>
            <p>Arrow Keys or Mouse to Control Left Paddle</p>
        </div>
        
        <div class="scoreboard">
            <div class="score-item player">
                <span class="score-label">Player</span>
                <span class="score-value" id="playerScore">0</span>
            </div>
            <div class="score-item vs">
                <span>VS</span>
            </div>
            <div class="score-item computer">
                <span class="score-label">Computer</span>
                <span class="score-value" id="computerScore">0</span>
            </div>
        </div>

        <canvas id="pongCanvas" width="800" height="400"></canvas>

        <div class="controls">
            <button id="startBtn" class="btn btn-primary">Start Game</button>
            <button id="resetBtn" class="btn btn-secondary">Reset Score</button>
        </div>

        <div class="instructions">
            <h3>How to Play:</h3>
            <ul>
                <li>Use <strong>Arrow Up/Down</strong> keys to move your paddle</li>
                <li>Or move your <strong>mouse</strong> vertically to control the paddle</li>
                <li>First player to <strong>10 points</strong> wins!</li>
                <li>The ball gains spin based on paddle movement</li>
            </ul>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
